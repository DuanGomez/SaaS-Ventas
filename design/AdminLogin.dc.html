<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #131316; }
    h1 { font-family: 'Sora', system-ui, sans-serif; margin: 0; }
    a { color: oklch(0.44 0.17 275); text-decoration: none; }
    a:hover { color: oklch(0.38 0.17 275); }
    input { font-family: inherit; }
    .btn-dark { background: #131316; color: #fff; transition: background .15s ease; cursor: pointer; }
    .btn-dark:hover { background: #2c2c31; }
  </style>
</helmet>

<div style="width:900px; height:700px; background:#131316; display:flex; align-items:center; justify-content:center;">
  <div style="width:420px; background:#fff; border-radius:24px; padding:44px 40px; display:flex; flex-direction:column; gap:28px; box-shadow:0 40px 80px -30px rgba(0,0,0,.5);">

    <div style="display:flex; flex-direction:column; gap:8px; align-items:center; text-align:center;">
      <div style="font-family:'Sora',sans-serif; font-weight:800; font-size:22px;">NOVA<span style="color:oklch(0.56 0.17 275);">.</span></div>
      <h1 style="font-size:22px; font-weight:700; margin-top:6px;">Panel de administración</h1>
      <div style="font-size:14px; color:#8b8b91;">Ingresa a la gestión de tu tienda</div>
    </div>

    <div style="display:flex; flex-direction:column; gap:16px;">
      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:13px; font-weight:600; color:#55565C;">Correo electrónico</label>
        <input type="email" placeholder="admin@tutienda.com" style="padding:13px 16px; border:1px solid #E6E4DE; border-radius:12px; font-size:15px; outline:none;"/>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:13px; font-weight:600; color:#55565C;">Contraseña</label>
        <input type="password" placeholder="••••••••" style="padding:13px 16px; border:1px solid #E6E4DE; border-radius:12px; font-size:15px; outline:none;"/>
      </div>
      <div style="display:flex; justify-content:flex-end;">
        <a href="#" style="font-size:13px; font-weight:600;">¿Olvidaste tu contraseña?</a>
      </div>
    </div>

    <div class="btn-dark" style="text-align:center; padding:15px; border-radius:12px; font-size:15px; font-weight:700;">Iniciar sesión</div>

    <div style="font-size:12px; color:#a2a2a8; text-align:center; line-height:1.6;">Acceso exclusivo para administradores de la tienda.<br/>¿Necesitas una cuenta de tienda? <a href="#">Solicítala aquí</a></div>
  </div>
</div>
</x-dc>
</body>
</html>
